[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tembolo1284/ferrumlog"

[workspace.dependencies]
fl-types = { path = "crates/fl-types" }
fl-storage = { path = "crates/fl-storage" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
